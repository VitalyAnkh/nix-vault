# Version checks use GitHub Commits API over HTTP.
# Avoid src.git: git ls-remote often times out on large repos / weak proxy networks.
# Regex must match ONLY the top-level commit "sha" — nvchecker takes the max of all
# matches, and GitHub JSON also contains tree/parent shas.

[source-emacs-master-igc]
src.webpage = "https://api.github.com/repos/emacs-mirror/emacs/commits/feature/igc3"
src.regex = "\\A\\s*\\{\\s*\"sha\"\\s*:\\s*\"([0-9a-f]{40})\""
fetch.github = "emacs-mirror/emacs"

[source-godot-master]
src.webpage = "https://api.github.com/repos/godotengine/godot/commits/master"
src.regex = "\\A\\s*\\{\\s*\"sha\"\\s*:\\s*\"([0-9a-f]{40})\""
fetch.github = "godotengine/godot"

[source-emacs-lsp-booster]
src.webpage = "https://api.github.com/repos/blahgeek/emacs-lsp-booster/commits/master"
src.regex = "\\A\\s*\\{\\s*\"sha\"\\s*:\\s*\"([0-9a-f]{40})\""
fetch.github = "blahgeek/emacs-lsp-booster"
cargo_lock = ["Cargo.lock"]

[source-codex-desktop-linux]
src.webpage = "https://api.github.com/repos/ilysenko/codex-desktop-linux/commits/main"
src.regex = "\\A\\s*\\{\\s*\"sha\"\\s*:\\s*\"([0-9a-f]{40})\""
fetch.github = "ilysenko/codex-desktop-linux"

[source-roxy-browser]
src.httpheader = "https://dl.roxybrowser.com/app-download/Linux-64-latest"
src.regex = "RoxyBrowser_x64_([0-9]+\\.[0-9]+\\.[0-9]+)\\.deb"
fetch.url = "https://lumibrowser.oss-cn-shenzhen.aliyuncs.com/public/package/app/Linux/x64/$ver/RoxyBrowser_x64_$ver.deb"

[source-nutstore-client]
src.manual = "6.4.3"
fetch.url = "https://pkg-cdn.jianguoyun.com/static/exe/ex/$ver/nutstore_client-$ver-linux-x86_64-public.tar.gz"

[source-nutstore-nautilus]
src.manual = "6.4.3"
fetch.url = "https://www.jianguoyun.com/static/exe/installer/nutstore_linux_src_installer.tar.gz"

[source-warp-terminal]
src.webpage = "https://api.github.com/repos/warpdotdev/Warp/commits/master"
src.regex = "\\A\\s*\\{\\s*\"sha\"\\s*:\\s*\"([0-9a-f]{40})\""
fetch.github = "warpdotdev/Warp"
